<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="signup-box">

        <input class="last-name" type="text" placeholder="Last Name">

        <input class="first-name" type="text" placeholder="First Name">

        <input class="email" type="text" placeholder="Email">

        <div>
            <button class="signup-button">Sign Up</button>
        </div>

    </div>

    <div class="uber-request-a-ride">

        <p>Request a ride now</p>

        <input class="pickup" type="text" placeholder="Enter pickup location">

        <input class="destination" type="" placeholder="Enter destination">


        <div class="buttons">

            <button class="request-button">Request now</button>

            <button class="schedule-button">Schedule for later</button>

        </div>

    </div>

</body>

</html>
